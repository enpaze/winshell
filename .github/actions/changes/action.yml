name: Changes
description: Which checks this pull request or push to main needs, as scripts/ci-changes.ps1 decides, or every check for a run by hand. Needs a checkout.

outputs:
  code:
    value: ${{ steps.files.outputs.code }}
  docs:
    value: ${{ steps.files.outputs.docs }}
  powershell:
    value: ${{ steps.files.outputs.powershell }}
  scripts:
    value: ${{ steps.files.outputs.scripts }}
  workflows:
    value: ${{ steps.files.outputs.workflows }}
  package:
    value: ${{ steps.files.outputs.package }}

runs:
  using: composite
  steps:
    - name: Look at the changed files
      id: files
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT: ${{ github.event_name }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.number }}
        BEFORE: ${{ github.event.before }}
        AFTER: ${{ github.sha }}
      run: |
        $ErrorActionPreference = 'Stop'
        $files = Join-Path $env:RUNNER_TEMP 'changed-files.json'
        if ($env:EVENT -eq 'workflow_dispatch') {
          # A run by hand has no change to compare against, and ci-changes.ps1 runs every check for an empty list.
          $rows = @()
          $limit = 3000
        } elseif ($env:PR) {
          $rows = @(gh api --paginate "repos/$env:REPO/pulls/$env:PR/files?per_page=100" --jq '.[] | @json')
          $limit = 3000
        } else {
          $rows = @(gh api "repos/$env:REPO/compare/$env:BEFORE...$env:AFTER" --jq '.files[] | @json')
          $limit = 300
        }
        if ($env:EVENT -ne 'workflow_dispatch' -and $LASTEXITCODE -ne 0) { throw 'Could not read changed files.' }
        $changed = @($rows | ForEach-Object { $_ | ConvertFrom-Json })
        ConvertTo-Json -InputObject $changed -Depth 10 | Set-Content -LiteralPath $files
        ./scripts/ci-changes.ps1 -Files $files -MaxFiles $limit |
          Out-File -LiteralPath $env:GITHUB_OUTPUT -Append -Encoding utf8
