name: Agent task
description: One ticket, which one pull request builds and closes.
labels:
  - ready-for-agent
body:
  - type: markdown
    attributes:
      value: |
        A ticket has these sections whether `/to-tickets` wrote it or you fill in this form.
        Label the issue with the `area:` label of the area you pick. If the ticket belongs to a spec, make it a sub-issue of the spec and add its blockers as blocked-by links.

  - type: textarea
    id: what-to-build
    attributes:
      label: What to build
      description: The end-to-end behavior this ticket makes work, from the user's side, not a list of changes layer by layer.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checks a reviewer can confirm, each one a test, a command, or a winshell inspect screenshot.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: blocked-by
    attributes:
      label: Blocked by
      description: Each ticket that must close before this one can start.
      placeholder: None (can start immediately)

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Each area is an `area:` label. A test or a doc page belongs to the area it covers.
      options:
        - cli (src/Winshell)
        - services (src/Winshell.Services)
        - shell (src/Winshell.Shell)
        - build (scripts/, .github/, packaging/, templates/, src/Winshell.Package, tests/TestSupport, shared build files)
        - docs (docs/ and root Markdown alone)
    validations:
      required: true
