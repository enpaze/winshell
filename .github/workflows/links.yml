name: Links

# Links to other sites, on main and every Monday, since a site can move a page without a change here. Links between
# pages are the ci job's. This one runs apart from pull requests, so a site that is down for a moment can't fail one.
on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "**/*.md"
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: links
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The lychee release archive, checked against its SHA-256 before it runs, so a replaced release asset can't
      # see the token. Dependabot does not see a raw download.
      - name: Install lychee
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pins = Import-PowerShellDataFile ./scripts/tool-pins.psd1
          $archive = Join-Path $env:RUNNER_TEMP 'lychee.tar.gz'
          $tag = "lychee-v$($pins.lychee.version)"
          Invoke-WebRequest -Uri "https://github.com/lycheeverse/lychee/releases/download/$tag/lychee-x86_64-unknown-linux-gnu.tar.gz" -OutFile $archive
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash
          if (-not $hash.Equals($pins.lychee.linuxSha256, [StringComparison]::OrdinalIgnoreCase)) {
            throw "lychee $($pins.lychee.version) SHA-256 is $hash, expected $($pins.lychee.linuxSha256)."
          }
          tar --extract --gzip --file $archive --directory $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:RUNNER_TEMP 'lychee-x86_64-unknown-linux-gnu')
          @(
            "LYCHEE_MAX_RETRIES=$($pins.lychee.maxRetries)"
            "LYCHEE_RETRY_WAIT_SECONDS=$($pins.lychee.retryWaitSeconds)"
          ) | Add-Content -Path $env:GITHUB_ENV
      # A rate-limited link (429) is retried after the pin's wait, and fails if it stays limited.
      - name: Check links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          lychee
          --no-progress
          --max-retries "$LYCHEE_MAX_RETRIES"
          --retry-wait-time "$LYCHEE_RETRY_WAIT_SECONDS"
          --max-concurrency 4
          --exclude-path 'docs/agents'
          'docs/**/*.md'
          README.md
          CONTRIBUTING.md
          GLOSSARY.md
          '.github/*.md'
