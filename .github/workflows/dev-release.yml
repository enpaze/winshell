name: Dev Release

on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dev-release
  cancel-in-progress: false

jobs:
  keep:
    name: keep
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: windows-2025
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.keep.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Keep the newest dev build
        id: keep
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $sha = $env:RELEASE_COMMIT
          if ($sha -notmatch '^[0-9a-f]{40}$') { throw "Bad commit '$sha'." }
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git merge-base --is-ancestor $sha origin/main
          if ($LASTEXITCODE -ne 0) { throw "$sha is not on origin/main." }
          $publish = 'true'
          $listed = gh api "repos/$($env:REPO)/releases?per_page=30"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $newest = @($listed | ConvertFrom-Json | ForEach-Object { $_ } |
              Where-Object { -not $_.draft -and $_.prerelease -and "$($_.tag_name)" -cmatch '^dev-[0-9a-f]{7}$' } |
              Sort-Object { [datetimeoffset]$_.published_at } -Descending) | Select-Object -First 1
          if ($newest) {
            $tagSha = (gh api "repos/$($env:REPO)/commits/$($newest.tag_name)" --jq .sha).Trim()
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git fetch origin $tagSha
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git merge-base --is-ancestor $sha $tagSha 2>$null
            if ($LASTEXITCODE -eq 0) {
              Write-Output "Dev is already $($newest.tag_name) at $tagSha, which contains $sha. Leaving it in place."
              $publish = 'false'
            }
          }
          "publish=$publish" >> $env:GITHUB_OUTPUT
          exit 0
      - name: Look up the dev version
        id: version
        if: steps.keep.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $sha = $env:RELEASE_COMMIT
          if ($sha -notmatch '^[0-9a-f]{40}$') { throw "Bad commit '$sha'." }
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($head -ne $sha) { throw "Checked out $head, expected $sha." }

          function Get-StableVersion([string]$Tag) {
            if ($Tag -cmatch '^v(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})$') {
              return $Matches[1] + '.' + $Matches[2] + '.' + $Matches[3]
            }
            return $null
          }
          function Compare-StableVersion([string]$Left, [string]$Right) {
            $a = $Left.Split('.')
            $b = $Right.Split('.')
            for ($i = 0; $i -lt 3; $i++) {
              $difference = [int]$a[$i] - [int]$b[$i]
              if ($difference -ne 0) { return [Math]::Sign($difference) }
            }
            return 0
          }

          $listed = gh release list --repo $env:REPO --limit 1000 --exclude-drafts --exclude-pre-releases --json tagName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $newest = $null
          foreach ($row in @($listed | ConvertFrom-Json)) {
            if (-not $row) { continue }
            $version = Get-StableVersion $row.tagName
            if ($version -and ((-not $newest) -or (Compare-StableVersion $version $newest) -gt 0)) {
              $newest = $version
            }
          }
          if ($newest) {
            git fetch origin "refs/tags/v${newest}:refs/tags/v${newest}"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $countText = git rev-list --count "v${newest}..$sha"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $base = $newest
          } else {
            $countText = git rev-list --count $sha
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $base = '0.0.0'
          }
          $count = [int]$countText.Trim()
          $nuget = "$base-dev.$count"
          if ($nuget -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-dev\.(0|[1-9][0-9]*)$') {
            throw "Bad version '$nuget'."
          }
          Write-Output "Dev version $nuget+$($sha.Substring(0, 7)) at $sha."
          "version=$nuget" >> $env:GITHUB_OUTPUT

  publish:
    name: publish (${{ matrix.runtime }})
    needs: keep
    if: needs.keep.outputs.publish == 'true'
    strategy:
      matrix:
        include:
          - runtime: win-x64
            runner: windows-2025
          - runtime: win-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: ./.github/actions/prepare # zizmor: ignore[self-repository]
      - name: Build
        shell: pwsh
        env:
          RUNTIME: ${{ matrix.runtime }}
          VERSION: ${{ needs.keep.outputs.version }}
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: pwsh scripts/package.ps1 -Publish -Runtime $env:RUNTIME -Out "$env:RUNNER_TEMP/artifacts" -Version $env:VERSION -Commit $env:RELEASE_COMMIT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: publish-${{ matrix.runtime }}
          path: ${{ runner.temp }}/artifacts/publish/
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  package:
    name: package
    needs: [keep, publish]
    if: needs.keep.outputs.publish == 'true'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: publish-*
          merge-multiple: true
          path: ${{ runner.temp }}/artifacts/publish
      - name: Pack and verify
        shell: pwsh
        env:
          VERSION: ${{ needs.keep.outputs.version }}
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: pwsh scripts/package.ps1 -Pack -Verify -Out "$env:RUNNER_TEMP/artifacts" -Version $env:VERSION -Commit $env:RELEASE_COMMIT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dev-packages
          path: |
            ${{ runner.temp }}/artifacts/*.zip
            ${{ runner.temp }}/artifacts/SHA256SUMS.txt
            ${{ runner.temp }}/artifacts/version.json
          if-no-files-found: error
          retention-days: 1

  release:
    name: release
    needs: [keep, package]
    if: needs.keep.outputs.publish == 'true'
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dev-packages
          path: packages
      - name: Publish the dev prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $sha = $env:RELEASE_COMMIT
          if ($sha -notmatch '^[0-9a-f]{40}$') { throw "Bad commit '$sha'." }
          $repo = $env:REPO
          $dist = 'packages'
          $published = Get-Content -Raw (Join-Path $dist 'version.json') | ConvertFrom-Json
          if ([string]$published.commit -cne $sha) { throw "version.json names $($published.commit), not $sha." }
          $display = [string]$published.version
          $nuget = $display.Split('+')[0]
          if ($display -cne "$nuget+$($sha.Substring(0, 7))") { throw "version.json names version $display, not $nuget+$($sha.Substring(0, 7))." }
          $files = @(
            (Join-Path $dist "winshell-$nuget-win-x64.zip"),
            (Join-Path $dist "winshell-$nuget-win-arm64.zip"),
            (Join-Path $dist 'version.json'),
            (Join-Path $dist 'SHA256SUMS.txt')
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "No $(Split-Path -Leaf $file) to publish." }
          }
          $tag = "dev-$($sha.Substring(0, 7))"
          $title = "Dev $display"
          $notes = Join-Path $env:RUNNER_TEMP 'dev-notes.txt'
          [System.IO.File]::WriteAllText($notes, "Dev build $display`n`nCommit $sha`n")
          gh release create $tag --repo $repo --target $sha --prerelease --latest=false --title $title --notes-file $notes @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $listed = gh api "repos/$repo/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $stale = @($listed | ConvertFrom-Json | ForEach-Object { $_ } |
              Where-Object { $_.prerelease -and "$($_.tag_name)" -cmatch '^dev-[0-9a-f]{7}$' -and $_.tag_name -cne $tag } |
              Sort-Object { [datetimeoffset]$_.created_at } -Descending | Select-Object -Skip 4)
          foreach ($release in $stale) {
            gh release delete $release.tag_name --repo $repo --yes
            if ($LASTEXITCODE -ne 0) { Write-Output "::warning::Could not delete the dev release $($release.tag_name)." }
          }
          exit 0
