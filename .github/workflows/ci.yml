name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.changes.outputs.code }}
      docs: ${{ steps.changes.outputs.docs }}
      powershell: ${{ steps.changes.outputs.powershell }}
      scripts: ${{ steps.changes.outputs.scripts }}
      workflows: ${{ steps.changes.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/changes # zizmor: ignore[self-repository]
        id: changes

  quality:
    name: quality
    needs: changes
    if: ${{ !cancelled() && github.event.pull_request.draft != true }}
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check links between pages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $pins = Import-PowerShellDataFile ./scripts/tool-pins.psd1
          $archive = Join-Path $env:RUNNER_TEMP 'lychee.zip'
          $tag = "lychee-v$($pins.lychee.version)"
          Invoke-WebRequest -Uri "https://github.com/lycheeverse/lychee/releases/download/$tag/lychee-x86_64-pc-windows-msvc.zip" -OutFile $archive -MaximumRetryCount $pins.lychee.downloadMaxRetries -RetryIntervalSec $pins.lychee.downloadRetrySeconds
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash
          if (-not $hash.Equals($pins.lychee.windowsSha256, [StringComparison]::OrdinalIgnoreCase)) {
            throw "lychee $($pins.lychee.version) SHA-256 is $hash, expected $($pins.lychee.windowsSha256)."
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP
          & (Join-Path $env:RUNNER_TEMP 'lychee-x86_64-pc-windows-msvc\lychee.exe') --offline --include-fragments --no-progress '**/*.md' '.github/**/*.md'
          exit $LASTEXITCODE
      - uses: ./.github/actions/prepare # zizmor: ignore[self-repository]
        if: needs.changes.outputs.powershell != 'false' || needs.changes.outputs.docs == 'true'
      - uses: ./.github/actions/powershell # zizmor: ignore[self-repository]
        if: needs.changes.outputs.powershell != 'false'
      - name: Check
        if: needs.changes.outputs.powershell != 'false'
        timeout-minutes: 15
        shell: pwsh
        run: |
          $env:PSModulePath = "$(Join-Path $env:RUNNER_TEMP 'psmodules');$env:PSModulePath"
          ./scripts/format.ps1 -VerifyNoChanges
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pins = Import-PowerShellDataFile ./scripts/tool-pins.psd1
          Import-Module Pester -RequiredVersion $pins.pester.version
          $result = Invoke-Pester -Path tests/Scripts -PassThru
          if ($result.Result -ne 'Passed') { exit 1 }
      - name: Check compiled documentation
        if: needs.changes.outputs.code == 'false' && needs.changes.outputs.docs == 'true'
        shell: pwsh
        run: ./scripts/check.ps1 -Tier Docs
  tests:
    name: tests (${{ matrix.shard }}/4)
    needs: changes
    if: ${{ !cancelled() && github.event.pull_request.draft != true && needs.changes.outputs.code != 'false' }}
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      TEST_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare # zizmor: ignore[self-repository]
      - name: Build the suite shard
        shell: pwsh
        run: |
          . ./scripts/lib/Tests.ps1
          $testRun = Get-TestRun -Shard $env:TEST_SHARD
          foreach ($project in $testRun.Projects) {
            dotnet build $project -warnaserror --nologo
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if ($testRun.CompileTemplateExamplesReferenceAndLogo) {
            ./scripts/build-template.ps1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $solution = [xml](Get-Content winshell.slnx)
            foreach ($project in $solution.SelectNodes('//Project') | Where-Object { $_.Path -match '^examples/' }) {
              dotnet build $project.Path -warnaserror --nologo
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            dotnet build scripts/generate-reference.cs --nologo
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            dotnet build scripts/render-logo.cs --nologo
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Run the suite shard
        shell: pwsh
        run: |
          . ./scripts/lib/Tests.ps1
          exit (Invoke-TestRun -Shard $env:TEST_SHARD -ResultsDirectory (Join-Path $env:RUNNER_TEMP 'test-results'))
      - name: Keep test timings and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: test-results-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-results/
          retention-days: 7
          if-no-files-found: ignore

  features:
    name: features
    needs: changes
    if: ${{ !cancelled() && github.event.pull_request.draft != true && needs.changes.outputs.code != 'false' }}
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare # zizmor: ignore[self-repository]
      - name: Drive every feature in the feature map
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'features'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $env:TEMP = $evidence
          $env:TMP = $evidence
          ./scripts/features.ps1 -Keep | Tee-Object -FilePath (Join-Path $evidence 'output.txt')
          exit $LASTEXITCODE
      - name: Keep the feature evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: features
          path: |
            ${{ runner.temp }}/features/output.txt
            ${{ runner.temp }}/features/winshell-features-*/scratch/
            ${{ runner.temp }}/features/winshell-features-*/local/run/
          retention-days: 7
          if-no-files-found: ignore

  comments:
    name: comments
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare # zizmor: ignore[self-repository]
      - name: Check that the code has no comments
        shell: pwsh
        run: ./scripts/comments.ps1 -VerifyNoChanges

  ci:
    name: ci
    needs: [quality, tests, installer, comments, features]
    if: ${{ always() && github.event.pull_request.draft != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.tests.result }}
          INSTALLER_RESULT: ${{ needs.installer.result }}
          COMMENTS_RESULT: ${{ needs.comments.result }}
          FEATURES_RESULT: ${{ needs.features.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$TEST_RESULT" = success || test "$TEST_RESULT" = skipped
          test "$INSTALLER_RESULT" = success || test "$INSTALLER_RESULT" = skipped
          test "$COMMENTS_RESULT" = success
          test "$FEATURES_RESULT" = success || test "$FEATURES_RESULT" = skipped

  actionlint:
    name: actionlint
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.workflows != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Read the tool pins
        id: pins
        shell: pwsh
        run: |
          $pins = Import-PowerShellDataFile ./scripts/tool-pins.psd1
          "actionlint=$($pins.actionlint.version)" >> $env:GITHUB_OUTPUT
          "zizmor=$($pins.zizmor.version)" >> $env:GITHUB_OUTPUT
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7
        with:
          version: "${{ steps.pins.outputs.actionlint }}"
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd
        with:
          version: "${{ steps.pins.outputs.zizmor }}"
          advanced-security: true
          annotations: false

  trim-caches:
    name: trim-caches
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete all but the newest databases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        continue-on-error: true
        run: |
          gh api --paginate "repos/$GH_REPO/actions/caches?key=codeql-overlay-base-database-&sort=created_at&direction=desc&per_page=100" \
            --jq '.actions_caches[] | "\(.id) \(.key)"' | sed -E 's/-[0-9a-f]{40}-.*//' | awk 'seen[$2]++ >= 2 { print $1 }' |
            xargs -r -I{} gh api --method DELETE "repos/$GH_REPO/actions/caches/{}"

  installer:
    name: installer
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.scripts != 'false' }}
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/powershell # zizmor: ignore[self-repository]
      - name: Pester (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $env:PSModulePath = "$(Join-Path $env:RUNNER_TEMP 'psmodules');$env:PSModulePath"
          $pins = Import-PowerShellDataFile .\scripts\tool-pins.psd1
          Import-Module Pester -RequiredVersion $pins.pester.version
          Invoke-Pester -Path tests/Scripts/Install.Tests.ps1 -CI
          exit $LASTEXITCODE
