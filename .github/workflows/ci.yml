name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  # A run by hand, on any branch, runs every check: gh workflow run ci.yml --ref <branch>.
  workflow_dispatch:

permissions:
  contents: read

# The main build, test and lint jobs live here. changes selects what a PR or main push needs, so prose runs only links.
#
# A new push cancels the superseded run on the same branch, including main and manual runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    # Only false skips, so a failed comparison still runs everything. Job-level skips satisfy required checks.
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.changes.outputs.code }}
      docs: ${{ steps.changes.outputs.docs }}
      tooling: ${{ steps.changes.outputs.tooling }}
      scripts: ${{ steps.changes.outputs.scripts }}
      workflows: ${{ steps.changes.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pinned actionlint cannot parse self-repository syntax; local actions use this checkout.
      - uses: ./.github/actions/changes # zizmor: ignore[self-repository]
        id: changes

  quality:
    name: quality
    needs: changes
    if: ${{ !cancelled() && github.event.pull_request.draft != true }}
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Offline, so only links to files in the repo and their headings: links.yml checks other sites. The lychee release
      # archive is checked against its SHA-256 before it runs. Dependabot doesn't update this: bump the version and the
      # digest together, here and in links.yml.
      - name: Check links between pages
        shell: pwsh
        env:
          LYCHEE_VERSION: lychee-v0.24.2
          LYCHEE_SHA256: 32975d1493ee1a975d6bb41e4fb56fe419cb442ded628bb772ba2e614acfacad
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $archive = Join-Path $env:RUNNER_TEMP 'lychee.zip'
          Invoke-WebRequest -Uri "https://github.com/lycheeverse/lychee/releases/download/$env:LYCHEE_VERSION/lychee-x86_64-pc-windows-msvc.zip" -OutFile $archive -MaximumRetryCount 5 -RetryIntervalSec 15
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash
          if (-not $hash.Equals($env:LYCHEE_SHA256, [StringComparison]::OrdinalIgnoreCase)) {
            throw "lychee $env:LYCHEE_VERSION SHA-256 is $hash, expected $env:LYCHEE_SHA256."
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP
          & (Join-Path $env:RUNNER_TEMP 'lychee-x86_64-pc-windows-msvc\lychee.exe') --offline --include-fragments --no-progress '**/*.md' '.github/**/*.md'
          exit $LASTEXITCODE
      # The pinned actionlint cannot parse self-repository syntax; local actions use this checkout.
      - uses: ./.github/actions/prepare # zizmor: ignore[self-repository]
        if: needs.changes.outputs.tooling != 'false' || needs.changes.outputs.docs == 'true'
      - uses: ./.github/actions/powershell # zizmor: ignore[self-repository]
        if: needs.changes.outputs.tooling != 'false'
      - name: Check
        if: needs.changes.outputs.tooling != 'false'
        timeout-minutes: 15
        shell: pwsh
        run: |
          $env:PSModulePath = "$(Join-Path $env:RUNNER_TEMP 'psmodules');$env:PSModulePath"
          ./scripts/format.ps1 -VerifyNoChanges
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Import-Module Pester -RequiredVersion 5.6.1
          $result = Invoke-Pester -Path tests/Scripts -PassThru
          if ($result.Result -ne 'Passed') { exit 1 }
      - name: Check compiled documentation
        if: needs.changes.outputs.code == 'false' && needs.changes.outputs.docs == 'true'
        shell: pwsh
        run: ./scripts/check.ps1 -Tier Docs
  tests:
    name: tests (${{ matrix.shard }}/5)
    needs: changes
    if: ${{ !cancelled() && github.event.pull_request.draft != true && needs.changes.outputs.code != 'false' }}
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    env:
      TEST_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pinned actionlint cannot parse self-repository syntax; local actions use this checkout.
      - uses: ./.github/actions/prepare # zizmor: ignore[self-repository]
      - name: Build the suite shard
        shell: pwsh
        run: |
          . ./scripts/lib/Tests.ps1
          $testRun = Get-TestRun -Shard $env:TEST_SHARD
          foreach ($project in $testRun.Projects) {
            dotnet build $project -warnaserror --nologo
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          # This worker already builds Shell and its dependencies. Keep template, sample and generator compilation
          # required here, while quality verifies files without loading the project graph.
          if ($env:TEST_SHARD -eq '2') {
            ./scripts/build-template.ps1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $solution = [xml](Get-Content winshell.slnx)
            foreach ($project in $solution.SelectNodes('//Project') | Where-Object { $_.Path -match '^(examples|docs/samples)/' }) {
              dotnet build $project.Path -warnaserror --nologo
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            dotnet build scripts/generate-reference.cs --nologo
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Run the suite shard
        shell: pwsh
        run: |
          . ./scripts/lib/Tests.ps1
          exit (Invoke-TestRun -Shard $env:TEST_SHARD -ResultsDirectory (Join-Path $env:RUNNER_TEMP 'test-results'))
      - name: Keep test timings and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-results/
          retention-days: 7
          if-no-files-found: ignore

  ci:
    # The single required test check fails if any suite shard or quality check failed or was cancelled.
    name: ci
    needs: [quality, tests, installer]
    if: ${{ always() && github.event.pull_request.draft != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.tests.result }}
          INSTALLER_RESULT: ${{ needs.installer.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$TEST_RESULT" = success || test "$TEST_RESULT" = skipped
          test "$INSTALLER_RESULT" = success || test "$INSTALLER_RESULT" = skipped

  actionlint:
    # actionlint catches broken expressions, typos and shell errors in .github/workflows/. zizmor audits .github/ for
    # unpinned actions, risky triggers, leaked credentials and template injection. A finding that is safe on purpose gets
    # a `# zizmor: ignore[<audit>]` comment explaining why. The ruleset requires this job by name.
    name: actionlint
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.workflows != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # checkout
      security-events: write # publishes the SARIF to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          # The action's default is latest, which downloads whatever release rhysd/actionlint just published.
          version: "1.7.12"
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          # The action's default is latest, which follows a lock that moves when this action pin moves.
          # 1.31.1 is the newest stable release that lock can run.
          version: "1.31.1"
          # This repository is public, so code scanning accepts the SARIF. The action rejects annotations
          # at the same time.
          advanced-security: true
          annotations: false

  trim-caches:
    # CodeQL's default setup saves a database per language on each push to main and reads only the newest, which fills
    # the 10 GB GitHub keeps. It is a separate job so that the job that runs the code under test gets no token that can
    # delete caches.
    name: trim-caches
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write # deletes cache entries
    steps:
      - name: Delete all but the newest databases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Two per language and CodeQL version, which the key names before the commit: this push's may still be saving
        # while the last push's is the one read. Two pushes can race to delete the same entry, and nothing needs this
        # step to pass.
        continue-on-error: true
        run: |
          gh api --paginate "repos/$GH_REPO/actions/caches?key=codeql-overlay-base-database-&sort=created_at&direction=desc&per_page=100" \
            --jq '.actions_caches[] | "\(.id) \(.key)"' | sed -E 's/-[0-9a-f]{40}-.*//' | awk 'seen[$2]++ >= 2 { print $1 }' |
            xargs -r -I{} gh api --method DELETE "repos/$GH_REPO/actions/caches/{}"

  installer:
    name: installer
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.scripts != 'false' }}
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pinned actionlint cannot parse self-repository syntax; local actions use this checkout.
      - uses: ./.github/actions/powershell # zizmor: ignore[self-repository]
      - name: Pester (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $env:PSModulePath = "$(Join-Path $env:RUNNER_TEMP 'psmodules');$env:PSModulePath"
          Import-Module Pester -RequiredVersion 5.6.1
          Invoke-Pester -Path tests/Scripts/Install.Tests.ps1 -CI
          exit $LASTEXITCODE
