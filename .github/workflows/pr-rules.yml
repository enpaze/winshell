name: PR Rules

on:
  # pull_request gives a fork's PR a read-only token and no secrets. The job checks out the base commit, so the rules a
  # pull request is held to are the base branch's, not its own.
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read # checkout
  pull-requests: read # the changed files

# Let every metadata check finish. A cancelled required check can block a pull request even after a newer run passes.

jobs:
  pr-rules:
    # The ruleset requires this job by name. Rename it there too if you rename it here.
    name: pr-rules
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: What this kind of change must carry
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.number }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          $files = Join-Path $env:RUNNER_TEMP 'files.txt'
          gh api --paginate "repos/$env:REPO/pulls/$env:PR/files" --jq '.[].filename' > $files
          ./scripts/pr-rules.ps1 -Title $env:TITLE -Body $env:BODY -Path $files
